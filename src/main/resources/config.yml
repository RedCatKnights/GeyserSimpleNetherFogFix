# ============================================
# GeyserSimpleNetherFogFix Configuration
# ============================================

# [Fallback] Periodic Check Interval (seconds)
# Once the fog is removed, it stays removed even across biomes, so a longer interval (30-60) is recommended.
# Set to 0 to disable periodic checks. (Default: 30)
# 【保険】定期チェックの間隔（秒）
# 一度霧が消えれば別のバイオームへ移動しても維持されるため、長め（30〜60）の設定で問題ありません。
# 0を設定すると定期チェック自体が無効になります。（デフォルト: 30）
check-interval-seconds: 30

# Note: 1000ms = 1 second / 1500ms = 1.5 seconds
# メモ: 1000ms = 1秒 / 1500ms = 1.5秒

# [On Login] Delay (in milliseconds) before removing the fog after a player logs in.
# Increase this value if your server or network is slow to load chunks.
# Set to 0 to disable the login check. (Default: 1500)
# 【ログイン時】プレイヤーがログインしてから霧を消すまでの待機時間（ミリ秒）
# サーバーや回線が重く読み込みに時間がかかる場合は、少し長めに設定してください。
# 0を設定するとログイン時のチェック自体が無効になります。（デフォルト: 1500）
login-delay-milliseconds: 1500

# [On Dimension Change] Delay (in milliseconds) before removing the fog after entering the Nether.
# Accounts for client loading time immediately after passing through a portal.
# Set to 0 to disable the dimension change check. (Default: 1500)
# 【ディメンション移動時】ネザーに入ってから霧を消すまでの待機時間（ミリ秒）
# ポータル移動直後のクライアント読み込み時間を考慮して調整します。
# 0を設定すると移動時のチェック自体が無効になります。（デフォルト: 1500）
dimension-change-delay-milliseconds: 1500
